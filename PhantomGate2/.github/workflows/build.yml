name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Build
      run: |
        xcodebuild clean build -project PhantomGate2.xcodeproj -scheme PhantomGate2 -destination 'platform=macOS'
        
    - name: Test
      run: |
        xcodebuild test -project PhantomGate2.xcodeproj -scheme PhantomGate2 -destination 'platform=macOS' 